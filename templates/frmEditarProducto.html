<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Editar Producto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ESTILOS PARA LA TIENDA DE ROPA -->
    <style>

        body {
            background: linear-gradient(135deg, #fdf2f8, #f3e8ff);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
        }

        h2 {
            color: #3b0764;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        form {
            background: white !important;
            border: none !important;
            border-radius: 20px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12) !important;
            overflow: hidden;
        }

        form > .bg-danger {
            background: linear-gradient(135deg, #7e22ce, #be185d) !important;
            padding: 18px !important;
            border-radius: 12px !important;
        }

        form > .bg-danger h4 {
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-label {
            color: #4c1d95;
            font-weight: bold;
        }

        .form-control {
            border: 2px solid #e9d5ff;
            border-radius: 10px;
            padding: 11px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 0.2rem rgba(168, 85, 247, 0.15);
        }

        select.form-control {
            cursor: pointer;
        }

        .text-muted {
            color: #6b21a8 !important;
            font-weight: bold;
        }

        .text-center img {
            object-fit: cover;
            border: 3px solid #c026d3 !important;
            padding: 3px;
            background: white;
            transition: transform 0.3s;
        }

        .text-center img:hover {
            transform: scale(1.08);
        }

        .btn-success {
            background: linear-gradient(135deg, #7e22ce, #a21caf);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #6b21a8, #86198f);
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f5d0fe;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            color: #581c87 !important;
            transition: 0.3s;
        }

        .btn-warning:hover {
            background: #e879f9;
            transform: translateY(-2px);
        }

        input[type="file"] {
            background-color: #faf5ff;
        }

        /* Decoración de la página */
        body::before {
            content: "👗  FASHION STORE  👕";
            display: block;
            text-align: center;
            padding-top: 25px;
            color: #7e22ce;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
        }

    </style>

</head>

<body>

<div class="container mt-4 mb-5">

    <h2 class="text-center mb-4">GESTIÓN PRODUCTOS</h2>

    <form action="/actualizar" method="POST" enctype="multipart/form-data"
          class="col-md-6 offset-md-3 p-4 border rounded bg-light shadow-sm">

        <div class="bg-danger text-white text-center py-2 mb-3 rounded">
            <h4>EDITAR PRODUCTO</h4>
        </div>

        <!-- Campo oculto para el ID fundamental para actualizar en MongoDB -->
        <input type="hidden" name="idProducto" id="idProducto" value="{{producto['_id']}}">

        <div class="mb-3">
            <label class="form-label">Código:</label>
            <input type="number" name="txtCodigo" class="form-control"
                   value="{{producto['codigo']}}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" name="txtNombre" class="form-control"
                   value="{{producto['nombre']}}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio:</label>
            <input type="number" name="txtPrecio" class="form-control"
                   value="{{producto['precio']}}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría:</label>

            <select name="cbCategoria" class="form-control">

                <option value="ROPA"
                    {% if producto['categoria'] == 'ROPA' %}selected{% endif %}>
                    ROPA
                </option>

                <option value="ELECTRODOMESTICO"
                    {% if producto['categoria'] == 'ELECTRODOMESTICO' %}selected{% endif %}>
                    ELECTRODOMESTICO
                </option>

            </select>
        </div>

        <div class="text-center mb-3">

            <p class="mb-1 text-muted">Foto actual:</p>

            <img src="../static/imagenes/{{producto['_id']}}.jpg"
                 width="80"
                 height="80"
                 class="rounded border">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Seleccione Foto (jpg) si va a cambiar:
            </label>

            <input type="file"
                   name="fileFoto"
                   class="form-control">

        </div>

        <div class="d-flex justify-content-between">

            <button type="submit" class="btn btn-success px-4">
                Editar
            </button>

            <a href="/" class="btn btn-warning text-dark px-4">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
