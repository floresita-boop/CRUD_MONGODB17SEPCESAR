<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión Productos</title>

    <!-- Bootstrap y FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- ESTILOS AGREGADOS -->
    <style>

        body {
            background: linear-gradient(135deg, #fdf2f8, #f3e8ff);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 35px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h2 {
            color: #3b0764;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Decoración superior */
        body::before {
            content: "👗  FASHION STORE  👕";
            display: block;
            text-align: center;
            padding-top: 25px;
            color: #7e22ce;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* Botón Agregar */
        .btn-success {
            background: linear-gradient(135deg, #7e22ce, #be185d) !important;
            border: none;
            border-radius: 10px;
            padding: 10px 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(126, 34, 206, 0.3);
        }

        /* Tabla */
        .table {
            overflow: hidden;
            border-radius: 12px;
            margin-top: 15px;
        }

        .table thead {
            background: linear-gradient(135deg, #7e22ce, #be185d) !important;
        }

        .table-dark {
            --bs-table-bg: transparent;
        }

        .table thead th {
            color: white;
            border: none;
            padding: 15px 10px;
            vertical-align: middle;
        }

        .table tbody td {
            padding: 12px;
            border-color: #eadcf5;
        }

        .table tbody tr {
            transition: 0.2s;
        }

        .table tbody tr:hover {
            background-color: #faf5ff;
            transform: scale(1.005);
        }

        /* Fotos de los productos */
        .table img {
            width: 65px !important;
            height: 65px !important;
            object-fit: cover;
            border-radius: 12px !important;
            border: 3px solid #e9d5ff;
            padding: 2px;
            background: white;
            transition: 0.3s;
        }

        .table img:hover {
            transform: scale(1.1);
            border-color: #a855f7;
        }

        /* Íconos */
        .fa-edit {
            transition: 0.2s;
        }

        .fa-edit:hover {
            color: #7e22ce !important;
            transform: scale(1.2);
        }

        .fa-trash {
            transition: 0.2s;
        }

        .fa-trash:hover {
            color: #be185d !important;
            transform: scale(1.2);
        }

        /* Nombre del producto */
        .table tbody td:nth-child(2) {
            font-weight: bold;
            color: #4c1d95;
        }

        /* Precio */
        .table tbody td:nth-child(3) {
            font-weight: bold;
            color: #be185d;
        }

    </style>

</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4" style="font-weight: bold;">
        GESTIÓN PRODUCTOS
    </h2>

    <!-- Botón Agregar verde -->
    <a href="/agregar" class="btn btn-success mb-3">
        Agregar
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark text-center">

            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Foto</th>
                <th>Acción</th>
            </tr>

        </thead>

        <tbody>

            {% for producto in listaProductos %}

            <tr>

                <td class="align-middle text-center">
                    {{producto["codigo"]}}
                </td>

                <td class="align-middle">
                    {{producto["nombre"]}}
                </td>

                <td class="align-middle">
                    ${{producto["precio"]}}
                </td>

                <td class="align-middle">
                    {{producto["categoria"]}}
                </td>

                <td class="text-center">

                    <img src="../static/imagenes/{{producto['_id']}}.jpg"
                         width="50"
                         height="50"
                         class="rounded">

                </td>

                <td class="text-center align-middle"
                    style="font-size: 1.3rem;">

                    <a href="/consultar/{{producto['_id']}}"
                       class="me-2">

                        <i class="fa fa-edit text-warning"
                           title="Editar"></i>

                    </a>

                    <i onclick="abrirModalEliminar('{{producto['_id']}}')"
                       class="fa fa-trash text-danger"
                       title="Eliminar"
                       style="cursor: pointer;"></i>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

<!-- Scripts de SweetAlert y JS propio -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
